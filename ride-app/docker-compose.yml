services:
  ride-allocation:
    build: .
    ports:
      - "8000:8000"
    environment:
      BIKE_TAXIS: "true"
      bike-taxis: "true"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
